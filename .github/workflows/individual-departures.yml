name: Decolagens individuais controladas
on:
  workflow_dispatch:
    inputs:
      departure_mode:
        description: 'Modo: repository usa EXECUTE_INDIVIDUAL; simulation impede decolagens reais'
        type: choice
        default: repository
        options: [repository, simulation, production]
      execute:
        description: 'Solicitar producao; false usa departure_mode e politica do repositorio'
        type: boolean
        default: false
      max_departures:
        description: 'Limite manual 1 a 100; 0 usa MAX_INDIVIDUAL_DEPARTURES'
        type: number
        default: 0
      confirm_semiautomatic_execution:
        description: 'No modo semiautomatico, confirmar decolagens reais somente nesta run'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: airline-manager-4-main
  cancel-in-progress: false
jobs:
  depart:
    # Explicit manual/API invocation only. Never repeat a real run attempt.
    if: github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:state
      - run: npx playwright install --with-deps chromium
      - name: Testar protecoes sem credenciais
        run: npm test
      - name: Limpar somente relatorios de testes sinteticos
        run: rm -rf test-results/demand
      - name: Resolver modo e limite de decolagens
        id: departure_settings
        env:
          AM4_INPUT_MODE: ${{ inputs.departure_mode }}
          AM4_INPUT_EXECUTE: ${{ inputs.execute }}
          AM4_INPUT_MAX_DEPARTURES: ${{ inputs.max_departures }}
          AM4_REPOSITORY_EXECUTE: ${{ vars.EXECUTE_INDIVIDUAL || 'true' }}
          AM4_REPOSITORY_MAX_DEPARTURES: ${{ vars.MAX_INDIVIDUAL_DEPARTURES || '20' }}
          AM4_DISPATCH_ALL_READY: ${{ vars.DISPATCH_ALL_READY || 'true' }}
          AM4_SEMI_AUTOMATIC: ${{ vars.SEMI_AUTOMATIC_MODE || 'false' }}
          AM4_SEMI_CONFIRM: ${{ inputs.confirm_semiautomatic_execution && 'true' || 'false' }}
        run: node scripts/resolve-departure-settings.cjs

      - name: Executar somente o executor individual
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ENABLE_DEMAND_MANAGER: 'true'
          DEMAND_FAIL_SAFE: 'true'
          DEMAND_DRY_RUN: ${{ steps.departure_settings.outputs.dry_run }}
          DEMAND_EXECUTION_ACK: individual-return-legs-v1
          DEMAND_MAX_DEPARTURES_PER_RUN: ${{ steps.departure_settings.outputs.max_departures }}
          MIN_DEMAND_PERCENTAGE: '80'
          DEMAND_THRESHOLD_MODE: aggregate
          DEMAND_POOL_SCOPE: airport-pair
          DEMAND_MAX_AGE_SECONDS: '300'
          AIRLINE_BASES_JSON: ${{ vars.AIRLINE_BASES_JSON }}
          AIRCRAFT_ORIGINS_JSON: ${{ vars.AIRCRAFT_ORIGINS_JSON || '[]' }}
          ENABLE_RETURN_JOURNAL: 'false'
          ENABLE_CAMPAIGN: ${{ steps.departure_settings.outputs.dry_run == 'true' && 'false' || (vars.ENABLE_CAMPAIGN || 'true') }}
          INCREASE_AIRLINE_REPUTATION: ${{ vars.INCREASE_AIRLINE_REPUTATION || 'true' }}
          CAMPAIGN_TYPE: ${{ vars.CAMPAIGN_TYPE || '1' }}
          CAMPAIGN_DURATION: ${{ vars.CAMPAIGN_DURATION || '4' }}
        run: npx playwright test -c playwright.execution.config.ts
      - name: Resumo individual
        if: always()
        run: |
          if [ -f test-results/demand/execution-report.md ]; then
            cat test-results/demand/execution-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Relatorios sem credenciais ou gravacao de login
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: individual-departures-report
          path: |
            test-results/demand/execution-report.json
            test-results/demand/execution-report.md
          if-no-files-found: warn
          retention-days: 7
