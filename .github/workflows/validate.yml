name: Validar codigo sem acessar o jogo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditar dependencias (bloquear alta e critica)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build:state
      - run: node scripts/company-dashboard.cjs --self-test
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Publicar simulacoes sem dados da companhia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-simulation-reports
          path: test-results/unit/**/simulation-report.json
          if-no-files-found: warn
          retention-days: 14
